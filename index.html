<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>광부 청이 — 웹 체험판</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!--
      웹 빌드 1-3-1-A — «가짜 바탕화면». 브라우저 탭은 바탕화면 위에 투명하게 뜰 수 없어서
      페이지가 벽지 · 작업 표시줄 · 일하는 창을 그리고, 게임은 작업 표시줄 바로 위 왼쪽에 선다(데스크톱 처음 자리와 같다).
      🔴 벽지 색(--wall)은 게임이 하늘을 칠하는 색(RunPlatform.WallpaperRgb = #3A6EA5)과 같아야 캔버스 테두리가 안 보인다.
    -->
    <div id="note">
      <b>광부 청이</b> · 웹 체험판<br>
      광차나 탑을 눌러 정산 · ◆ 판을 누르면 강화<br>
      <small>PC 판은 이 그림처럼 <i>실제 바탕화면</i> 위에 떠 있어요</small>
    </div>

    <div id="work" aria-hidden="true">
      <div class="title"><span>할 일.txt — 메모장</span><span class="btns">─ ☐ ✕</span></div>
      <div class="body">
        오늘 할 일<br>
        - 주간 보고서 마무리<br>
        - 회의록 정리 (14:00)<br>
        - 메일 답장 3통<br>
        <br>
        <span class="muted">← 일하는 동안 굴 띠에서 광부가 판다.<br>&nbsp;&nbsp;&nbsp;흘끗 봤을 때 탑이 솟아 있으면 눌러 깬다.</span>
      </div>
    </div>

    <!-- 🆕 D70 · D83 깨는 자리 — 띠 높이의 아이콘 · 창(#desk) · 그 위를 흐리는 네모들(#trail). 캔버스는 투명하고 그 위를 걸어간다 -->
    <canvas id="desk" aria-hidden="true"></canvas>
    <div id="trail" aria-hidden="true"></div>

    <div id="unity-container">
      <canvas id="unity-canvas" width=384 height=576 tabindex="-1"></canvas>
      <div id="load">
        <b id="loadname">광부 청이</b>
        <div id="status">불러오는 중…</div>
        <div class="bar"><div id="loadfill"></div></div>
      </div>
    </div>

    <div id="taskbar">
      <div class="start">▦</div>
      <div class="app"></div>
      <div class="app"></div>
      <div class="app active"><img src="TemplateData/favicon.png" alt=""></div>
      <div class="clock" id="clock"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var statusEl = document.getElementById("status");
      var loadEl = document.getElementById("load");
      var fillEl = document.getElementById("loadfill");
      var loaded = false;
      var LOAD_SHARE = 70, PREPARE_END = 96, PREPARE_SEC = 9, HIDE_MS = 200;
      function setBar(v) { fillEl.dataset.pct = v; fillEl.style.transform = "translateX(" + (v - 100) + "%)"; }
      function setStatus(msg, err) { statusEl.textContent = msg; statusEl.className = err ? "err" : ""; loadEl.className = err ? "err" : loadEl.className; loadEl.style.display = msg ? "block" : "none"; }
      function fail(msg) { if (!loaded) setStatus("못 켰다 — " + String(msg).split("\n")[0].slice(0, 200), true); }
      window.addEventListener("error", function (e) { fail(e.message || "오류"); });
      window.addEventListener("unhandledrejection", function (e) { fail(e.reason && (e.reason.message || e.reason)); });

      // 브라우저 언어가 한국어가 아니면 페이지 글을 영어로(게임 안 글은 첫 실행에서 고른다 — 첫 실행 · 웹 빌드)
      if (!/^ko/i.test(navigator.language || "")) {
        document.documentElement.lang = "en";
        document.title = "Chungi, the Miner — web demo";
        document.getElementById("note").innerHTML = "<b>Chungi, the Miner</b> · web demo<br>Click the cart or tower to sell · click ◆ for upgrades<br><small>The PC build floats on your <i>real desktop</i>, like this</small>";
        document.querySelector("#work .title span").textContent = "todo.txt — Notepad";
        document.querySelector("#work .body").innerHTML = "Today<br>- Finish weekly report<br>- Meeting notes (14:00)<br>- Reply to 3 emails<br><br><span class=\"muted\">← The miner digs while you work.<br>&nbsp;&nbsp;&nbsp;Glance over; if the tower is tall, click to sell it.</span>";
        statusEl.textContent = "Loading…";
        document.getElementById("loadname").textContent = "Chungi, the Miner";
      }
      // 받는 동안 WebGL 캔버스는 검게 지워진다 — 다 켜질 때까지 숨겨 벽지가 보이게(바탕화면 위에 검은 사각형이 뜨지 않게)
      canvas.style.visibility = "hidden";
      // 브라우저 오른쪽 클릭 메뉴를 캔버스에서 끈다(웹 빌드 1-3-1-A)
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      // 시계 — 바탕화면 흉내
      function tick() {
        var d = new Date();
        var loc = /^ko/i.test(navigator.language || "") ? "ko-KR" : undefined;   // 영어 페이지는 브라우저 형식
        document.getElementById("clock").innerHTML = d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" }) + "<br>" + d.toLocaleDateString(loc);
      }
      tick(); setInterval(tick, 10000);

      // 캔버스 = 도트 192×288 × 2(CSS px). 화면이 작으면 그때만 줄인다(도트는 image-rendering 으로 각지게).
      var W = 384, H = 576, BAR = 48;
      // 부순 자리 = 흐림만(화면 벽 1-3-1-D · D83) — #trail 안 네모마다 backdrop-filter(BlurTrail 이 자리를 정한다)
      var desk = document.getElementById("desk");
      var trail = document.getElementById("trail");
      var trailPanes = {};
      var BAND = 160;
      function paintDesk() {
        desk.width = window.innerWidth;
        desk.height = BAND;
        var d = desk.getContext("2d");
        d.fillStyle = "#3A6EA5";
        d.fillRect(0, 0, desk.width, BAND);
        function icon(x, w, h, c) {
          d.fillStyle = "rgba(0,0,0,.35)"; d.fillRect(x + 1, 30 + 42 - h + 1, w, h);
          d.fillStyle = c; d.fillRect(x, 30 + 42 - h, w, h);
        }
        function pane(x) {
          d.fillStyle = "rgba(0,0,0,.3)"; d.fillRect(x + 4, 18, 300, 124);
          d.fillStyle = "#F2F2EE"; d.fillRect(x, 14, 300, 124);
          d.fillStyle = "#4C78B4"; d.fillRect(x, 14, 300, 18);
          d.fillStyle = "#C4524A"; d.fillRect(x + 276, 14, 24, 18);
          d.fillStyle = "#585860"; d.font = "12px Consolas, monospace";
          var t = ["오늘 할 일", "- 주간 보고서 마무리", "- 회의록 정리 (14:00)", "- 메일 답장 3통", "- 탑이 높으면 깬다"];
          for (var i = 0; i < t.length; i++) d.fillText(t[i], x + 12, 50 + i * 18);
        }
        icon(420, 34, 40, "#F4F4F0"); icon(490, 34, 40, "#F4F4F0"); icon(560, 42, 28, "#F0D060");
        pane(660);
        icon(1010, 42, 28, "#F0D060");
        pane(1090);
        icon(1440, 34, 40, "#F4F4F0"); icon(1510, 42, 28, "#F0D060");
      }
      paintDesk();
      window.minerTrailPane = function (id, x, y, w, h) {
        var el = trailPanes[id];
        if (w <= 0 || h <= 0) {
          if (el) { el.remove(); delete trailPanes[id]; }
          return;
        }
        if (!el) {
          el = document.createElement("div");
          el.className = "pane";
          trail.appendChild(el);
          trailPanes[id] = el;
        }
        el.style.left = x + "px"; el.style.top = y + "px"; el.style.width = w + "px"; el.style.height = h + "px";
        trail.dataset.stamps = (Number(trail.dataset.stamps) || 0) + 1;
      };
      window.minerTrailClear = function () {
        trail.textContent = "";
        trailPanes = {};
      };
      // 창 크기가 바뀌면 — 바탕을 다시 그리고 캔버스가 페이지 밖에 남지 않게(화면 벽 1-3-1-D)
      window.addEventListener("resize", function () {
        paintDesk();
        var c = document.getElementById("unity-container");
        var max = Math.max(0, window.innerWidth - canvas.getBoundingClientRect().width);
        if (parseInt(c.style.left || "0", 10) > max) c.style.left = max + "px";
      });
      function fit() {
        var k = Math.min(1, (window.innerHeight - BAR) / H, window.innerWidth / W);
        canvas.style.width = (W * k) + "px";
        canvas.style.height = (H * k) + "px";
      }
      fit();
      window.addEventListener("resize", fit);

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/5a81be0a7d467cf923de4dd3f8f83efa.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/9957f47ab1c66dac8b12040c6108fbd8.data.unityweb",
        frameworkUrl: buildUrl + "/bdda18815e2359d02ec2014de4e280c3.framework.js.unityweb",
        codeUrl: buildUrl + "/68e46025263f913d1e2b8736b2ce7a32.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GameOriented",
        productName: "ProjectMiner",
        productVersion: "1.0",
        // 도트를 칸 그대로 — 브라우저 배율(2배 화면)에 맞춰 키우면 192×288 가 흐려진다(웹 빌드 1-2-1-D)
        devicePixelRatio: 1,
        webglContextAttributes: { alpha: true, premultipliedAlpha: true },
        showBanner: function (msg, type) { if (type === "error") fail(msg); else console.warn(msg); },
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var pct = Math.floor(progress * 100);
          var ko = /^ko/i.test(navigator.language || "");
          // 🔄 D161 막대 하나로 끝까지 — 받기 = 0 ~ 70 · 준비 = 70 ~ 96(그림을 받고 켜는 동안 천천히) · 켜지면 100
          var shown = Math.floor(pct * LOAD_SHARE / 100);
          if (!statusEl.className) setStatus(pct >= 100 ? (ko ? "준비하는 중…" : "Starting…") : (ko ? "불러오는 중 " : "Loading ") + shown + "%");
          if (pct >= 100) {
            if (!statusEl.className && loadEl.className !== "busy") {
              loadEl.className = "busy";
              fillEl.style.transition = "transform " + PREPARE_SEC + "s cubic-bezier(.12,.6,.3,1)";
              setBar(PREPARE_END);
            }
          } else {
            setBar(shown);
          }
        }).then(function (instance) {
          // 🔄 2026-10-27 리뷰 — 여기서는 아직 안 보인다. 게임이 표 · 글자를 HTTP 로 더 받고 첫 그림을 올린 뒤
          //   MinerPage.jslib 의 minerReady 로 알린다. 실패하면 minerFail 이 글을 띄운다(전엔 빈 캔버스 · 글 없음).
          unityInstance = instance;
          setTimeout(function () {
            if (!loaded && !statusEl.className) setStatus(KO ? "멈춘 것 같다 — 새로 고침해 줘" : "Seems stuck — please reload", true);
          }, 60000);
        }).catch(function (message) { fail(message); });
      };
      var unityInstance = null;
      var KO = /^ko/i.test(navigator.language || "");
      window.minerReady = function () {
        loaded = true;
        canvas.style.visibility = "visible";
        fillEl.style.transition = "transform " + HIDE_MS / 1000 + "s linear";
        setBar(100);
        setTimeout(function () { setStatus(""); }, HIDE_MS);
      };
      window.minerFail = function (msg) {
        setStatus((KO ? "못 켰다 — " : "Failed to start — ") + String(msg).split("\n")[0].slice(0, 200), true);
      };
      // 탭이 숨거나 닫힐 때 저장 — Ctrl+W 처럼 창이 흐려지지 않고 닫히는 탭은 OnApplicationFocus 가 안 왔다(2026-10-27 리뷰)
      function saveNow() { if (unityInstance && loaded) { try { unityInstance.SendMessage("Miner", "SaveFromPage"); } catch (e) {} } }
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") saveNow(); });
      window.addEventListener("pagehide", saveNow);
      document.body.appendChild(script);
    </script>
  </body>
</html>
